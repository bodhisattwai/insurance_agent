<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apeejay AI Insurance Advisor</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');

        :root {
            --primary-color: #003366;
            --accent-color: #FFBF00;
            --bg-color: #f4f7f9;
            --bot-bubble-bg: #ffffff;
            --user-bubble-bg: #003366;
            --text-primary: #333;
            --text-light: #ffffff;
            --border-color: #e0e0e0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chatbot-container {
            width: 100%;
            max-width: 550px;
            height: 90vh;
            max-height: 800px;
            display: flex;
            flex-direction: column;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .chat-header {
            background: var(--primary-color);
            color: var(--text-light);
            padding: 1rem;
            text-align: center;
            font-weight: 600;
            font-size: 1.2rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .chat-window {
            flex-grow: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message-bubble {
            padding: 12px 20px;
            border-radius: 20px;
            max-width: 85%;
            line-height: 1.6;
            word-wrap: break-word;
            animation: fadeIn 0.5s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; translateY(0); }
        }

        .bot {
            background-color: var(--bot-bubble-bg);
            color: var(--text-primary);
            align-self: flex-start;
            border: 1px solid var(--border-color);
            border-radius: 20px 20px 20px 5px;
        }

        .user {
            background-color: var(--user-bubble-bg);
            color: var(--text-light);
            align-self: flex-end;
            border-radius: 20px 20px 5px 20px;
        }
        
        .input-area {
            padding: 1rem;
            border-top: 1px solid var(--border-color);
            background-color: #fff;
        }
        
        .chat-input {
            width: 100%;
            padding: 12px 18px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .send-button {
            width: 100%;
            margin-top: 10px;
            padding: 12px 25px;
            border: none;
            background-color: var(--primary-color);
            color: white;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
        }
        
        .options-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .option-button {
            padding: 10px 20px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            cursor: pointer;
            background: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        
        .option-button:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .option-button.selected {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .option-button input { display: none; }
        
        .recommendation-card {
            margin-top: 1rem;
            padding: 1rem;
            background-color: #f0f8ff;
            border-left: 4px solid var(--accent-color);
            white-space: pre-wrap; /* To respect newlines from the LLM */
        }
        .recommendation-card h3 { margin: 0 0 0.5rem 0; color: var(--primary-color); }
        .recommendation-card p { margin: 0; }
    </style>
</head>
<body>
    <div class="chatbot-container">
        <div class="chat-header">Apeejay AI Insurance Advisor</div>
        <div class="chat-window" id="chat-window"></div>
        <div class="input-area" id="input-area"></div>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const inputArea = document.getElementById('input-area');
        
        let collectedData = {};
        let currentQuestionIndex = 0;
        let isBotTyping = false;

        const conversationFlow = [
            { key: "Age", text: "Hello! I'm your AI advisor from Apeejay Insurance. I'll ask a few questions to build your financial profile. First, what is your age?", type: "number", validation: v => v > 17 && v < 100, error: "Please enter a valid age (18-99)." },
            { key: "Income_Source", text: "What is your primary source of income?", type: "radio", options: ["Salaried", "Business Owner", "Self-Employed", "Retired"] },
            { key: "annualIncome", text: "Which range does your annual income fall into?", type: "radio", options: ["$15k-$30k", "$30k-$50k", "$50k-$75k", "$75k-$100k", "$100k+"] },
            { key: "familySize", text: "How many members are in your immediate family?", type: "number", validation: v => v > 0, error: "Please enter a valid number." },
            { key: "relationshipStatus", text: "What is your relationship status?", type: "radio", options: ["Single", "Married w/ Kids", "Married w/ Spouse", "Divorced", "Widowed"] },
            { key: "financialGoal", text: "What is your single most important financial goal right now?", type: "radio", options: ["Health Coverage", "Retirement Savings", "Tax Saving", "Wealth Creation", "Child Education Fund"] },
            { key: "lifestyleFactors", text: "Which of the following lifestyle factors apply to you? (Select all that apply)", type: "checkbox", options: ["Smoker", "high stress job", "Sedentary lifestyle", "Owns a car", "travels frequently", "Owns property", "Pet owner", "active lifestyle", "Works night shifts", "international travel", "Prefers homeopathic treatment"] },
            { key: "end", text: "Thank you for the detailed information. I am now analyzing your complete profile with our AI engine...", isProcessing: true },
        ];

        function addMessage(text, sender, recommendation = null) {
            const messageBubble = document.createElement('div');
            messageBubble.className = `message-bubble ${sender}`;
            messageBubble.innerHTML = text;
            
            if (recommendation) {
                const card = document.createElement('div');
                card.className = 'recommendation-card';
                card.innerHTML = `<h3>${recommendation.name}</h3><p>${recommendation.recommendation}</p>`;
                messageBubble.appendChild(card);
            }
            chatWindow.appendChild(messageBubble);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }
        
        function renderInput() {
            const question = conversationFlow[currentQuestionIndex];
            inputArea.innerHTML = ''; 

            if (question.type === 'number' || question.type === 'text') {
                const form = document.createElement('form');
                form.onsubmit = handleTextInput;
                form.innerHTML = `
                    <input type="${question.type}" class="chat-input" placeholder="Type your answer..." required>
                    <button type="submit" class="send-button">Send</button>
                `;
                inputArea.appendChild(form);
                form.querySelector('input').focus();
            } else if (question.type === 'radio' || question.type === 'checkbox') {
                const optionsContainer = document.createElement('div');
                optionsContainer.className = 'options-container';
                
                question.options.forEach(opt => {
                    const button = document.createElement('button');
                    button.className = 'option-button';
                    button.textContent = opt;
                    button.onclick = (e) => {
                        if (question.type === 'radio') {
                            handleOptionClick(opt);
                        } else {
                            e.currentTarget.classList.toggle('selected');
                        }
                    };
                    optionsContainer.appendChild(button);
                });
                inputArea.appendChild(optionsContainer);

                if (question.type === 'checkbox') {
                    const submitBtn = document.createElement('button');
                    submitBtn.className = 'send-button';
                    submitBtn.textContent = 'Confirm Lifestyle Factors';
                    submitBtn.onclick = handleCheckboxSubmit;
                    inputArea.appendChild(submitBtn);
                }
            }
        }
        
        function processNextStep(data) {
             currentQuestionIndex++;
             collectedData = {...collectedData, ...data};

             if (currentQuestionIndex < conversationFlow.length) {
                const nextQuestion = conversationFlow[currentQuestionIndex];
                setTimeout(() => {
                    addMessage(nextQuestion.text, "bot");
                    if (nextQuestion.isProcessing) {
                        callApi();
                    } else {
                        renderInput();
                    }
                }, 800);
             }
        }

        function handleTextInput(e) {
            e.preventDefault();
            const input = e.target.querySelector('input');
            const question = conversationFlow[currentQuestionIndex];
            if (question.validation && !question.validation(input.value)) {
                addMessage(question.error, 'bot');
                return;
            }
            addMessage(input.value, 'user');
            processNextStep({ [question.key]: input.value });
        }
        
        function handleOptionClick(option) {
            addMessage(option, 'user');
            const question = conversationFlow[currentQuestionIndex];
            processNextStep({ [question.key]: option });
        }

        function handleCheckboxSubmit() {
            const selected = Array.from(inputArea.querySelectorAll('.option-button.selected')).map(btn => btn.textContent);
            const userResponse = selected.length > 0 ? selected.join(', ') : 'None';
            addMessage(userResponse, 'user');
            processNextStep({ lifestyleFactors: selected });
        }
        
        async function callApi() {
            inputArea.innerHTML = '<p style="text-align:center; color:#888;">Getting your personalized recommendation...</p>';
            try {
                 const response = await fetch('https://apeejay-advisor-api.onrender.com/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(collectedData)
                });
                if (!response.ok) throw new Error('Network response was not ok.');
                const result = await response.json();
                
                setTimeout(() => {
                    if (result.error) {
                         addMessage(`Sorry, there was an issue: ${result.error}`, 'bot');
                    } else {
                         addMessage(`Analysis complete! Based on your profile as a **${result.name}**, here's my personalized advice:`, 'bot', result);
                    }
                    inputArea.innerHTML = '<p style="text-align:center; color:#888;">Thank you for using the Apeejay AI Advisor!</p>';
                }, 1500);

            } catch (error) {
                console.error('API Error:', error);
                addMessage('Sorry, I couldn\'t connect to the AI engine. Please check the server and try again later.', 'bot');
            }
        }

        function startConversation() {
            addMessage(conversationFlow[0].text, "bot");
            renderInput();
        }
        
        startConversation();
    </script>
</body>
</html>
