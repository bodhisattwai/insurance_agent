<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apeejay AI Life Insurance Advisor</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');

    :root {
        --primary-color: #003366;
        --accent-color: #FFBF00;
        --bg-color: #f4f7f9;
        --bot-bubble-bg: #ffffff;
        --user-bubble-bg: #003366;
        --text-primary: #333;
        --text-light: #ffffff;
        --border-color: #e0e0e0;
    }

    body {
        font-family: 'Poppins', sans-serif;
        background-color: var(--bg-color);
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .chatbot-container {
        width: 100%;
        max-width: 550px;
        height: 90vh;
        max-height: 800px;
        display: flex;
        flex-direction: column;
        background: #fff;
        border-radius: 15px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        overflow: hidden;
    }

    .chat-header {
        background: var(--primary-color);
        color: var(--text-light);
        padding: 1rem;
        text-align: center;
        font-weight: 600;
        font-size: 1.2rem;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        z-index: 10;
    }

    .chat-window {
        flex-grow: 1;
        padding: 1.5rem;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    .message-bubble {
        padding: 12px 20px;
        border-radius: 20px;
        max-width: 85%;
        line-height: 1.6;
        word-wrap: break-word;
        animation: fadeIn 0.5s ease-out;
    }
    
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; translateY(0); }
    }

    .bot {
        background-color: var(--bot-bubble-bg);
        color: var(--text-primary);
        align-self: flex-start;
        border: 1px solid var(--border-color);
        border-radius: 20px 20px 20px 5px;
    }

    .user {
        background-color: var(--user-bubble-bg);
        color: var(--text-light);
        align-self: flex-end;
        border-radius: 20px 20px 5px 20px;
    }
    
    .input-area {
        padding: 1rem;
        border-top: 1px solid var(--border-color);
        background-color: #fff;
    }
    
    .chat-input {
        width: 100%;
        padding: 12px 18px;
        border: 1px solid #ddd;
        border-radius: 25px;
        font-size: 1rem;
        box-sizing: border-box;
    }

    .send-button {
        width: 100%;
        margin-top: 10px;
        padding: 12px 25px;
        border: none;
        background-color: var(--primary-color);
        color: white;
        border-radius: 25px;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 600;
    }
    
    .options-container {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: flex-start;
    }

    .option-button {
        display: inline-flex;
        align-items: center;
        padding: 10px 20px;
        border: 1px solid var(--border-color);
        border-radius: 20px;
        cursor: pointer;
        background: #fff;
        font-family: 'Poppins', sans-serif;
        font-size: 0.9rem;
        transition: all 0.2s ease;
    }
    
    .option-button:hover {
        border-color: var(--primary-color);
        color: var(--primary-color);
    }

    .option-button.selected {
        background-color: var(--primary-color);
        color: white;
        border-color: var(--primary-color);
    }
    
    .option-button .icon {
        margin-right: 8px;
        font-size: 1.2em;
    }

    .options-group {
        width: 100%;
        margin-bottom: 1rem;
    }
    
    .group-title {
        text-align: left;
        color: #777;
        font-weight: 500;
        font-size: 0.9rem;
        margin-bottom: 10px;
        margin-left: 5px;
    }

    .none-button {
        width: 100%;
        justify-content: center;
        border-style: dashed;
    }

    .recommendation-card {
        margin-top: 1rem;
        padding: 1rem;
        background-color: #f0f8ff;
        border-left: 4px solid var(--accent-color);
        white-space: pre-wrap;
    }
    .recommendation-card h3 { margin: 0 0 0.5rem 0; color: var(--primary-color); }
    .recommendation-card p { margin: 0; }
</style>
</head>
<body>
<div class="chatbot-container">
<div class="chat-header">Apeejay AI Life Insurance Advisor</div>
<div class="chat-window" id="chat-window"></div>
<div class="input-area" id="input-area"></div>
</div>

<script>
    const chatWindow = document.getElementById('chat-window');
    const inputArea = document.getElementById('input-area');
    
    let collectedData = {};
    let currentQuestionIndex = 0;

    const conversationFlow = [
        { key: "Age", text: "Hello! I'm your AI advisor from Apeejay Insurance. I'll ask a few questions to find the perfect life insurance plan for you. First, what is your age?", type: "number", validation: v => v > 17 && v < 70, error: "Please enter a valid age for life insurance (18-69)." },
        { key: "Income_Source", text: "What is your primary source of income?", type: "radio", options: ["Salaried", "Business Owner", "Self-Employed", "Retired"] },
        { key: "annualIncome", text: "Which range does your annual income fall into?", type: "radio", options: ["₹3 Lakh - ₹7 Lakh", "₹7 Lakh - ₹12 Lakh", "₹12 Lakh - ₹20 Lakh", "₹20 Lakh - ₹30 Lakh", "₹30 Lakh+"] },
        { key: "familySize", text: "How many people are financially dependent on you?", type: "number", validation: v => v >= 0, error: "Please enter a valid number (0 if none)." },
        { key: "relationshipStatus", text: "What is your relationship status?", type: "radio", options: ["Single", "Married", "Married with Children", "Divorced", "Widowed"] },
        { key: "financialGoal", text: "What is your primary goal for taking a life insurance policy?", type: "radio", options: ["Family's Financial Security", "Wealth Creation & Savings", "Child's Future Planning", "Retirement Planning", "Tax Saving"] },
        { 
            key: "lifestyleFactors", 
            text: "To help me understand your needs better, please select any of the following that apply to you.", 
            type: "groupedCheckbox",
            groups: [
                { title: "Health & Habits", options: [ { text: "Smoker", icon: "🚭" }, { text: "Major health conditions", icon: "❤️" } ] },
                { title: "Occupation & Lifestyle", options: [ { text: "High-Risk Occupation", icon: "👷" }, { text: "High-Stress Job", icon: "💼" }, { text: "Travels Frequently", icon: "✈️" } ] },
                { title: "Assets", options: [ { text: "Owns Property", icon: "🏠" } ] }
            ],
            noneOption: { text: "None of the above", icon: "✅" }
        },
        { key: "end", text: "Thank you. I am now analyzing your profile with our AI engine to find the best life insurance solution for you...", isProcessing: true },
    ];

    function addMessage(text, sender, recommendation = null) {
        const messageBubble = document.createElement('div');
        messageBubble.className = `message-bubble ${sender}`;
        // A simple markdown-to-HTML conversion for bolding
        messageBubble.innerHTML = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        
        if (recommendation) {
            const card = document.createElement('div');
            card.className = 'recommendation-card';
            card.innerHTML = `<h3>${recommendation.name}</h3><p>${recommendation.recommendation}</p>`;
            messageBubble.appendChild(card);
        }
        chatWindow.appendChild(messageBubble);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }
    
    function renderInput() {
        const question = conversationFlow[currentQuestionIndex];
        inputArea.innerHTML = ''; 

        if (question.type === 'number') {
            const form = document.createElement('form');
            form.onsubmit = handleTextInput;
            form.innerHTML = `<input type="number" class="chat-input" placeholder="Type your answer..." required><button type="submit" class="send-button">Send</button>`;
            inputArea.appendChild(form);
            form.querySelector('input').focus();

        } else if (question.type === 'radio') {
            const optionsContainer = document.createElement('div');
            optionsContainer.className = 'options-container';
            question.options.forEach(opt => {
                const button = document.createElement('button');
                button.className = 'option-button';
                button.textContent = opt;
                button.onclick = () => handleOptionClick(opt);
                optionsContainer.appendChild(button);
            });
            inputArea.appendChild(optionsContainer);
        
        } else if (question.type === 'groupedCheckbox') {
            const form = document.createElement('form');
            form.className = 'options-container';
            form.onsubmit = (e) => { e.preventDefault(); handleCheckboxSubmit(); };

            // Render grouped options
            question.groups.forEach(group => {
                const groupContainer = document.createElement('div');
                groupContainer.className = 'options-group';
                groupContainer.innerHTML = `<div class="group-title">${group.title}</div>`;
                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'options-container';

                group.options.forEach(opt => {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'option-button';
                    button.dataset.value = opt.text;
                    button.innerHTML = `<span class="icon">${opt.icon}</span> ${opt.text}`;
                    button.onclick = handleMultiSelect;
                    optionsDiv.appendChild(button);
                });
                groupContainer.appendChild(optionsDiv);
                form.appendChild(groupContainer);
            });

            // Render "None of the above" option
            if (question.noneOption) {
                const noneBtn = document.createElement('button');
                noneBtn.type = 'button';
                noneBtn.className = 'option-button none-button';
                noneBtn.dataset.value = question.noneOption.text;
                noneBtn.id = 'none-option';
                noneBtn.innerHTML = `<span class="icon">${question.noneOption.icon}</span> ${question.noneOption.text}`;
                noneBtn.onclick = handleNoneSelect;
                form.appendChild(noneBtn);
            }

            const submitBtn = document.createElement('button');
            submitBtn.type = 'submit';
            submitBtn.className = 'send-button';
            submitBtn.textContent = 'Confirm Details';
            form.appendChild(submitBtn);

            inputArea.appendChild(form);
        }
    }

    function handleMultiSelect(e) {
        const clickedButton = e.currentTarget;
        clickedButton.classList.toggle('selected');
        // Deselect "None" if any other option is selected
        if (clickedButton.classList.contains('selected')) {
            document.getElementById('none-option')?.classList.remove('selected');
        }
    }

    function handleNoneSelect(e) {
        const noneButton = e.currentTarget;
        const allOptionButtons = inputArea.querySelectorAll('.option-button:not(.none-button)');
        // Deselect all others if "None" is selected
        allOptionButtons.forEach(btn => btn.classList.remove('selected'));
        noneButton.classList.toggle('selected');
    }
    
    function processNextStep(data) {
         currentQuestionIndex++;
         collectedData = {...collectedData, ...data};
         if (currentQuestionIndex < conversationFlow.length) {
            const nextQuestion = conversationFlow[currentQuestionIndex];
            setTimeout(() => {
                addMessage(nextQuestion.text, "bot");
                if (nextQuestion.isProcessing) {
                    callApi();
                } else {
                    renderInput();
                }
            }, 800);
         }
    }

    function handleTextInput(e) {
        e.preventDefault();
        const input = e.target.querySelector('input');
        const question = conversationFlow[currentQuestionIndex];
        if (question.validation && !question.validation(input.value)) {
            addMessage(question.error, 'bot');
            return;
        }
        addMessage(input.value, 'user');
        processNextStep({ [question.key]: input.value });
    }
    
    function handleOptionClick(option) {
        addMessage(option, 'user');
        const question = conversationFlow[currentQuestionIndex];
        processNextStep({ [question.key]: option });
    }

    function handleCheckboxSubmit() {
        const selected = Array.from(inputArea.querySelectorAll('.option-button.selected')).map(btn => btn.dataset.value);
        const userResponse = selected.length > 0 ? selected.join(', ') : 'None specified';
        addMessage(userResponse, 'user');
        const question = conversationFlow[currentQuestionIndex];
        processNextStep({ [question.key]: selected });
    }
    
    async function callApi() {
        inputArea.innerHTML = '<p style="text-align:center; color:#888;">Getting your personalized recommendation...</p>';
        try {
            const response = await fetch('[https://insurance-agent-api.onrender.com/predict](https://insurance-agent-api.onrender.com/predict)', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(collectedData)
            });
            if (!response.ok) throw new Error(`Network response error: ${response.statusText}`);
            const result = await response.json();
            
            setTimeout(() => {
                if (result.error) {
                     addMessage(`Sorry, there was an issue: ${result.error}`, 'bot');
                } else {
                     addMessage(`Analysis complete! Based on your profile as a **${result.name}**, here's my personalized advice:`, 'bot', result);
                }
                inputArea.innerHTML = '<p style="text-align:center; color:#888;">Thank you for using the Apeejay AI Advisor!</p>';
            }, 1500);

        } catch (error) {
            console.error('API Error:', error);
            addMessage('Sorry, I couldn\'t connect to the AI engine. Please check the server and try again later.', 'bot');
        }
    }

    function startConversation() {
        addMessage(conversationFlow[0].text, "bot");
        renderInput();
    }
    
    startConversation();
</script>
</body>
</html>
