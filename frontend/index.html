<meta charset="utf-8"> <!-- prevents weird token errors with ₹ etc. -->

<div id="app" class="advisor"></div>
<script>
(function () {
  const el = document.getElementById("app");

  const mock = {
    persona:"Cautious Planner",
    assumptions:{HLV_multiple:12, city_cost_level:"metro"},
    life_plan:{sum_assured:"₹1.2Cr", rationale:"HLV ~10–12× income"},
    health_plan:{base_floater:"₹10L", super_topup:"₹40L @ ₹5L", rationale:"metro + parents SR"},
    motor_plan:{type:"Comprehensive", riders:["Zero Dep","Engine Protect"]},
    tax_plan:{"80C":"₹1.5L","80D":"₹75k","notes":"Illustrative—verify latest rules"},
    explain_like_im_12:"First protect income with term; then big hospital bills with top-up.",
    disclaimers:"No premium quotes without sources; verify PED/waiting periods."
  };

  function viewLoading() {
    el.innerHTML = `<div class="p-6 text-sm text-slate-600">Loading recommendation…</div>`;
  }
  function viewError(msg) {
    el.innerHTML = `
      <div class="p-6 text-red-700 bg-red-50 border border-red-200 rounded-lg">
        <div class="font-semibold mb-2">Couldn’t reach the advisor API</div>
        <div class="mb-3">${msg}</div>
        <button id="useMock" class="px-3 py-1 rounded bg-blue-600 text-white">Show sample output</button>
      </div>`;
    document.getElementById("useMock").onclick = () => render(mock);
  }
  function render(data) {
    el.innerHTML = `
      <div class="p-6 space-y-3">
        <div class="text-xs uppercase tracking-wide text-slate-500">Persona</div>
        <div class="text-lg font-semibold">${data.persona}</div>

        <div class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-4">
          <section class="p-4 rounded-lg border">
            <h3 class="font-semibold mb-2">Life Plan</h3>
            <pre class="text-sm whitespace-pre-wrap">${JSON.stringify(data.life_plan, null, 2)}</pre>
          </section>
          <section class="p-4 rounded-lg border">
            <h3 class="font-semibold mb-2">Health Plan</h3>
            <pre class="text-sm whitespace-pre-wrap">${JSON.stringify(data.health_plan, null, 2)}</pre>
          </section>
          <section class="p-4 rounded-lg border">
            <h3 class="font-semibold mb-2">Motor Plan</h3>
            <pre class="text-sm whitespace-pre-wrap">${JSON.stringify(data.motor_plan, null, 2)}</pre>
          </section>
          <section class="p-4 rounded-lg border">
            <h3 class="font-semibold mb-2">Tax Plan</h3>
            <pre class="text-sm whitespace-pre-wrap">${JSON.stringify(data.tax_plan, null, 2)}</pre>
          </section>
        </div>

        <section class="p-4 rounded-lg bg-slate-50 border">
          <h3 class="font-semibold mb-2">Explain Like I’m 12</h3>
          <p class="text-sm">${data.explain_like_im_12}</p>
        </section>

        <p class="text-xs text-slate-500">${data.disclaimers}</p>
      </div>`;
  }

  async function boot() {
    viewLoading();
    // Abort if API stalls >5s
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 5000);

    try {
      const body = { profile: { age: 30, income_band: "₹20–25L", family_size: 4 } };
      const res = await fetch("http://localhost:7860/predict", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(body),
        signal: ctrl.signal
      });
      clearTimeout(t);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      render(json);
    } catch (err) {
      clearTimeout(t);
      // Show graceful error + mock button
      viewError(err.message || "Network error");
    }
  }

  boot();
})();
</script>
